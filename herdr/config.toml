[keys]
prefix = "ctrl+a"
focus_agent = "prefix+1..9"
switch_tab = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"
split_horizontal = "prefix+h"
focus_pane_left = "prefix+j"
focus_pane_up = "prefix+i"
focus_pane_down = "prefix+k"
focus_pane_right = "prefix+l"
navigate_pane_left = "j"
navigate_pane_up = "i"
navigate_pane_down = "k"
navigate_pane_right = "l"

[ui]
agent_panel_sort = "spaces"

[theme]
name = "nord"
auto_switch = false
